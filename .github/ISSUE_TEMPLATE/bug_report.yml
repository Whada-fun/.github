name: 🐛 缺陷回報
description: 回報程式錯誤或非預期行為
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感謝你花時間回報問題。

        > ⚠️ **若這是資安漏洞，請勿在此回報。**
        > 請改依[資安政策](https://github.com/Whada-fun/.github/blob/main/SECURITY.md)以私密管道通報。

        > ⚠️ **請勿貼上金鑰、密碼、玩家個資或未公開的商業資訊。**

  - type: checkboxes
    id: prechecks
    attributes:
      label: 送出前確認
      options:
        - label: 我已搜尋過現有的 issue（含已關閉的），確認不是重複回報
          required: true
        - label: 我使用的是仍在支援期限內的版本
          required: true
        - label: 這不是資安漏洞
          required: true

  - type: textarea
    id: summary
    attributes:
      label: 問題描述
      description: 簡短說明發生了什麼事
      placeholder: 進入商店頁面後，畫面停在載入動畫不會結束。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 重現步驟
      description: 請盡量精簡到最小重現案例
      placeholder: |
        1. 開啟遊戲並登入
        2. 點選主畫面右下角「商店」
        3. 等待約 10 秒
        4. 畫面停在載入動畫
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 預期行為
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 實際行為
      description: 若有錯誤訊息，請貼上**完整**內容
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 建置編號
      placeholder: "1.4.2 (build 20260801)"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: 平台
      multiple: true
      options:
        - iOS
        - Android
        - Windows
        - macOS
        - Linux
        - 主機平台
        - 網頁
        - 其他
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 裝置與作業系統版本
      placeholder: "iPhone 15 Pro / iOS 18.2"

  - type: dropdown
    id: frequency
    attributes:
      label: 發生頻率
      options:
        - 每次都發生
        - 經常發生
        - 偶爾發生
        - 只發生過一次
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 佐證資料
      description: 截圖、錄影、log。可直接拖曳檔案到此欄位。
